{% extends 'base.html' %}

{% block content %}
<h2>로그인</h2>

<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label>아이디</label>
        <input type="text" name="username" class="form-control">
    </div>

    <div class="mb-3">
        <label>비밀번호</label>
        <input type="password" name="password" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">로그인</button>
</form>

{% endblock %}
