{% extends 'base.html' %}

{% block content %}
<h4 class="mb-3">고객사 목록</h4>

<table class="table table-hover">
    <thead>
        <tr>
            <th>회사명</th>
            <th>주소</th>
        </tr>
    </thead>

    <tbody>
        {% for c in clients %}
        <tr>
            <td>
                <a href="/clients/{{ c.id }}/">{{ c.name }}</a>
            </td>
            <td>{{ c.address }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
