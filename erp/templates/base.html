<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ERP 시스템</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .sidebar {
            width: 220px;
            height: 100vh;
            position: fixed;
            background: #2f4050;
            padding-top: 20px;
        }

        .sidebar a {
            color: #cfd8dc;
            display: block;
            padding: 12px 20px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #1c2733;
            color: white;
        }

        .topbar {
            height: 60px;
            background: white;
            border-bottom: 1px solid #ddd;
            padding: 10px 20px;
            margin-left: 220px;
        }

        .content {
            margin-left: 220px;
            padding: 20px;
        }

        .card-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>

<body>

<!-- 사이드바 -->
<div class="sidebar">
    <h4 class="text-white text-center">ERP</h4>

    <a href="/">📊 대시보드</a>
    <a href="/clients/">👥 고객사</a>
    <a href="/sales/">📄 견적</a>

    {% if user.is_superuser %}
        <a href="/admin/">⚙ 관리자</a>
    {% endif %}
</div>

<!-- 상단바 -->
<div class="topbar d-flex justify-content-between align-items-center">
    <div>업무 시스템</div>

    <div>
        {{ user.username }}
        <form action="/logout/" method="post" style="display:inline;">
            {% csrf_token %}
            <button class="btn btn-sm btn-outline-secondary">로그아웃</button>
        </form>
    </div>
</div>

<!-- 본문 -->
<div class="content">
    <div class="card-box">
        {% block content %}
        {% endblock %}
    </div>
</div>

</body>
</html>
